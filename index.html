<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partitassos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#8b5a2b">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <h1>🎻 Partitassos</h1>
</header>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="search">🔍 Buscar</button>
  <button class="tab-btn" data-tab="library">📚 Minhas Partituras</button>
</nav>

<main id="view-search" class="view active">
  <form id="search-form" class="search-form">
    <input id="search-query" type="text" placeholder="Nome da música" autocomplete="off" required>
    <input id="search-artist" type="text" placeholder="Artista (opcional)" autocomplete="off">
    <div class="search-actions">
      <button type="submit" class="btn big">Buscar</button>
      <button type="button" id="voice-btn" class="btn icon-btn" title="Buscar por voz">🎤</button>
    </div>
  </form>
  <p id="usage-counter" class="usage-counter"></p>
  <div id="search-status" class="status"></div>
  <div id="search-results" class="grid"></div>

  <p class="hint">Prefere procurar você mesmo? Abra a busca num site:</p>
  <div class="open-buttons">
    <button type="button" id="open-musescore" class="btn">🎼 Abrir no MuseScore</button>
    <button type="button" id="open-google" class="btn">🖼️ Abrir no Google Imagens</button>
  </div>

  <p class="hint">Achou uma partitura fora do app? Segure o dedo na imagem, toque em <b>"Baixar imagem"</b>, depois volte aqui:</p>
  <button type="button" id="add-from-gallery" class="btn primary big">📷 Adicionar da Galeria</button>
  <input type="file" id="gallery-input" accept="image/*" multiple hidden>
</main>

<main id="view-library" class="view">
  <div class="lib-toolbar">
    <input id="lib-search" type="text" placeholder="Buscar na biblioteca...">
    <select id="lib-filter-tag"><option value="">Todas as pastas</option></select>
  </div>
  <div id="library-results" class="grid"></div>
  <p id="library-empty" class="empty-msg" hidden>Nenhuma partitura salva ainda. Vá em "Buscar" para adicionar.</p>
</main>

<div id="viewer" class="viewer" hidden>
  <div class="viewer-top">
    <button id="viewer-close" class="btn icon-btn">✕</button>
    <div class="viewer-top-actions">
      <button id="viewer-theme" class="btn icon-btn" title="Alternar fundo">🌙</button>
      <button id="viewer-scroll" class="btn icon-btn" title="Rolagem automática">▶️</button>
    </div>
  </div>
  <div class="viewer-scroll-area" id="viewer-scroll-area">
    <img id="viewer-img" src="" alt="Partitura">
  </div>
  <div class="viewer-speed" id="viewer-speed-wrap" hidden>
    <label>Velocidade</label>
    <input type="range" id="viewer-speed" min="1" max="10" value="4">
  </div>
</div>

<div id="save-modal" class="modal" hidden>
  <div class="modal-box">
    <h2>Salvar partitura</h2>
    <label>Música</label>
    <input id="save-title" type="text">
    <label>Artista</label>
    <input id="save-artist" type="text">
    <label>Pasta/Tag</label>
    <input id="save-tag" type="text" placeholder="ex: Favoritas do papai" list="tag-options">
    <datalist id="tag-options"></datalist>
    <label>Status</label>
    <select id="save-status">
      <option value="quero aprender">Quero aprender</option>
      <option value="aprendendo">Aprendendo</option>
      <option value="aprendida">Aprendida</option>
    </select>
    <div class="modal-actions">
      <button id="save-cancel" class="btn">Cancelar</button>
      <button id="save-confirm" class="btn primary">Salvar</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/search.js"></script>
<script src="js/library.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
